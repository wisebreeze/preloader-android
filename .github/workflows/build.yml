name: Build Native Library

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect NDK & CMake
        id: sdk-paths
        run: |
          # ubuntu-latest ships Android SDK at $ANDROID_HOME (== $ANDROID_SDK_ROOT)
          # with a pre-installed NDK and CMake. Detect the versions actually
          # present instead of pinning a specific one that may not be cached.
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "android_home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -n1)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "ndk_path=$NDK_DIR" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK_DIR"

          CMAKE_BIN=$(ls "$ANDROID_HOME"/cmake/*/bin/cmake 2>/dev/null | head -n1)
          NINJA_BIN=$(ls "$ANDROID_HOME"/cmake/*/bin/ninja 2>/dev/null | head -n1)
          if [ -z "$CMAKE_BIN" ] || [ -z "$NINJA_BIN" ]; then
            echo "::error::No CMake/Ninja found under $ANDROID_HOME/cmake"
            exit 1
          fi
          echo "cmake_path=$CMAKE_BIN" >> "$GITHUB_OUTPUT"
          echo "ninja_path=$NINJA_BIN" >> "$GITHUB_OUTPUT"
          echo "Using CMake: $CMAKE_BIN"
          echo "Using Ninja: $NINJA_BIN"

      - name: Configure CMake (arm64-v8a)
        run: |
          mkdir -p build/arm64-v8a
          ${{ steps.sdk-paths.outputs.cmake_path }} \
            -S . \
            -B build/arm64-v8a \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.sdk-paths.outputs.ndk_path }}/build/cmake/android.toolchain.cmake \
            -DCMAKE_MAKE_PROGRAM=${{ steps.sdk-paths.outputs.ninja_path }} \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE

      - name: Build (arm64-v8a)
        run: |
          ${{ steps.sdk-paths.outputs.cmake_path }} \
            --build build/arm64-v8a \
            --target preloader \
            --config $CMAKE_BUILD_TYPE \
            -j$(nproc)

      - name: Stage artifacts
        run: |
          mkdir -p artifact/arm64-v8a
          cp build/arm64-v8a/libpreloader.so artifact/arm64-v8a/
          # CMake install collects the public headers
          ${{ steps.sdk-paths.outputs.cmake_path }} \
            --install build/arm64-v8a \
            --prefix artifact \
            --config $CMAKE_BUILD_TYPE || true
          ls -lh artifact/arm64-v8a/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpreloader-arm64-v8a
          path: artifact/
          if-no-files-found: error
          retention-days: 30
